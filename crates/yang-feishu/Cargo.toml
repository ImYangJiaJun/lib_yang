[package]
name = "yang-feishu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "飞书开放平台协议客户端：传输、令牌、多维表格、审批、事件、外部选项"
keywords = ["feishu", "lark", "openapi", "bitable", "approval"]
categories = ["api-bindings", "asynchronous"]
publish = false

[features]
default = []
# ReqwestTransport：自带 TLS 的独立使用者开；宿主用自己的 HostTransport 时不开。
http = ["dep:reqwest", "dep:rustls"]
# RedisTokenCache：独立使用者开；宿主用自己的 HostTokenCache 时不开。
redis = ["dep:redis"]
# 出站指标埋点（feishu_outbound_request_total / feishu_outbound_token_total）。
metrics = ["dep:metrics"]
full = ["http", "redis", "metrics"]

[dependencies]
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
base64.workspace = true
subtle.workspace = true
rand_core.workspace = true
aes.workspace = true
cbc.workspace = true
uuid = { workspace = true, features = ["v4"] }

# 显式收紧 tokio：不走 workspace 的 full，避免独立使用者被拖入完整运行时。
tokio = { version = "1.52.1", default-features = false, features = ["time"] }

reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
redis = { workspace = true, optional = true, features = ["aio", "tokio-comp", "script"] }
metrics = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "time"] }

[[example]]
name = "bitable_pull"
required-features = ["http"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
