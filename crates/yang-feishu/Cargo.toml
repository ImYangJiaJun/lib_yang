# 全部能力（旧 full 的超集）
full = [
    "api-all",
    "bitable",
    "approval",
    "contact",
    "im",
    "drive",
    "http",
    "redis",
    "metrics",
]

[dependencies]
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
base64.workspace = true
subtle.workspace = true
rand_core.workspace = true
aes.workspace = true
cbc.workspace = true
uuid = { workspace = true, features = ["v4"] }

# 显式收紧 tokio：不走 workspace 的 full，避免独立使用者被拖入完整运行时。
tokio = { version = "1.52.1", default-features = false, features = ["time"] }

reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
redis = { workspace = true, optional = true, features = ["aio", "tokio-comp", "script"] }
metrics = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "time"] }

[[example]]
name = "bitable_pull"
required-features = ["http", "bitable"]

[[test]]
name = "api_surface"
required-features = ["api-auth", "api-contact", "api-docx", "api-im"]

[[test]]
name = "approval_contract"
required-features = ["approval"]

[[test]]
name = "bitable_pagination"
required-features = ["bitable"]

[[test]]
name = "endpoints_contract"
required-features = ["im"]

[[test]]
name = "public_api"
required-features = ["drive", "im"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
