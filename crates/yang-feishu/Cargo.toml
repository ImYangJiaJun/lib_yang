[package]
name = "yang-feishu"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "飞书开放平台协议客户端：传输、令牌、多维表格、审批、事件、外部选项"
keywords = ["feishu", "lark", "openapi", "bitable", "approval"]
categories = ["api-bindings", "asynchronous"]

[features]
default = []
# ReqwestTransport：自带 TLS 的独立使用者开；宿主用自己的 HostTransport 时不开。
http = ["dep:reqwest", "dep:rustls"]
# RedisTokenCache：独立使用者开；宿主用自己的 HostTokenCache 时不开。
redis = ["dep:redis"]
# 出站指标埋点（feishu_outbound_request_total / feishu_outbound_token_total）。
metrics = ["dep:metrics"]

# typed 核心链路
bitable = ["api-bitable", "api-base"]
approval = ["api-approval"]
contact = ["api-contact", "api-user", "api-directory", "api-trust_party"]
im = ["api-im", "api-message", "api-bot", "api-cardkit", "api-event", "api-ephemeral"]
drive = ["api-drive"]

# 官方文档能力分组
docs = [
    "drive",
    "api-docx",
    "api-docs",
    "api-wiki",
    "api-sheets",
    "api-slides_ai",
    "api-block",
    "api-board",
    "api-lingo",
    "api-suite",
]
calendar = ["api-calendar", "api-vc", "api-meeting_room", "api-minutes"]
task = ["api-task"]
mail = ["api-mail"]
attendance = ["api-attendance"]
hr = [
    "api-corehr",
    "api-ehr",
    "api-hire",
    "api-payroll",
    "api-compensation",
    "api-performance",
    "api-okr",
]
ai = [
    "api-aily",
    "api-spark",
    "api-document_ai",
    "api-optical_char_recognition",
    "api-speech_to_text",
    "api-translation",
    "api-baike",
]
admin = [
    "api-admin",
    "api-tenant",
    "api-application",
    "api-security_and_compliance",
    "api-unified_kms",
    "api-verification",
    "api-human_authentication",
    "api-face_verify",
