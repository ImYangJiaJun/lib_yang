[package]
name = "yang-pcg"
version = "0.1.0"
edition.workspace = true

description = "个人使用地图生成"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/yang-pcg"
readme = "README.md"
keywords = ["pcg", "procedural", "roguelike", "map", "ue5"]
categories = ["game-development"]

#排除文件
exclude = [
    "INSTALL.md",
]

# yang-pcg 测试代码中使用了 expect/unwrap，不使用 workspace lints
[lints.rust]
unused_must_use = "deny"

[lints.clippy]
# 测试代码中使用 expect/unwrap 是合理的，允许
unwrap_used = "allow"
expect_used = "allow"
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"

[dependencies]
# 序列化支持
serde = { workspace = true }
serde_json = { workspace = true }

# 校验和
crc32fast = "1.4"  # CRC32 校验和计算

# 错误处理
thiserror = { workspace = true }

# 随机数生成
rand = "0.10.1"
rand_pcg = "0.10.2"

[dev-dependencies]
# 属性测试框架
proptest = "1.6"
