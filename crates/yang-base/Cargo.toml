[package]
name = "yang-base"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true

description = "个人使用构建后端服务器"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/yang-base"
readme = "README.md"
keywords = ["backend", "web", "action", "router", "jwt"]
categories = ["web-programming"]

#排除文件
exclude = [
    "INSTALL.md",
]

[lints]
workspace = true

[features]
# 默认启用完整后端能力
default = ["token", "http", "mysql", "redis", "validator", "plugin-schema"]

# JWT Token 管理功能（含认证通用机制：密码哈希、原子限流、邮箱验证码、浏览器会话 Cookie）
token = ["dep:jsonwebtoken", "dep:uuid", "redis", "dep:argon2", "dep:rand_core", "dep:hmac", "dep:http-uri", "dep:totp-lite"]

# HTTP 客户端功能
http = ["dep:reqwest", "dep:serde_urlencoded"]

# MySQL 数据库功能
mysql = ["dep:sqlx", "dep:base64", "sqlx/mysql", "sqlx/derive", "yang-db/mysql"]

# Redis 全局访问与 token 撤销存储
redis = ["yang-db/redis"]

# 字段校验器正则支持
validator = ["dep:regex"]

# 插件 JSON Schema 配置验证
plugin-schema = ["dep:jsonschema"]

# 运行期指标埋点（门面，默认关闭；运行期由调用方挂 exporter）
metrics = ["dep:metrics"]

# 从 ApiCatalog 投影 OpenAPI 3.1 JSON（默认关闭）
openapi = []

# 可选后台展示元数据；纯 std 类型，不引入依赖，也不改变核心 dispatch
admin-metadata = []

# Axum 0.8 HTTP 传输适配器（默认关闭；只拉入 axum/tower-http，不涉及 sqlx/reqwest）
transport-axum = ["dep:axum", "dep:tower", "dep:tower-http", "dep:serde_urlencoded", "dep:tempfile"]

[dependencies]
# 内部依赖
yang-db = { path = "../yang-db", version = "0.1.6", default-features = false }
yang-base-derive = { path = "../yang-base-derive", version = "0.2.1" }

# 异步运行时
tokio = { workspace = true }
async-trait = "0.1.89"

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
thiserror = { workspace = true }

# 日志
log = { workspace = true }

# 结构化追踪（可观测性 C4 核心横切能力）
tracing = { workspace = true }
tracing-log = { workspace = true }

# 工具库
chrono = { workspace = true }

# Base64 编码（可选，通过 "mysql" feature 启用，用于 Record 中 BLOB 类型的编码）
base64 = { workspace = true, optional = true }

# HTTP 客户端（可选，通过 "http" feature 启用）
reqwest = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }

# JWT Token（可选，通过 "token" feature 启用）
jsonwebtoken = { workspace = true, optional = true }

# 唯一标识（可选，通过 "token" feature 启用）
uuid = { workspace = true, optional = true }

# Step-up 资源绑定指纹（可选，通过 "token" feature 启用）
sha2.workspace = true

# 数据库（可选，通过 "mysql" feature 启用）
sqlx = { workspace = true, optional = true }

# 正则表达式（可选，通过 "validator" feature 启用）
regex = { workspace = true, optional = true }

# JSON Schema 验证（可选，通过 "plugin-schema" feature 启用）
jsonschema = { workspace = true, default-features = false, optional = true }

# 指标门面（可选，通过 "metrics" feature 启用）
metrics = { workspace = true, optional = true }

# JSON Schema 派生
schemars = { workspace = true }

# 路由模板校验与语义冲突检测
matchit = { workspace = true }

# Axum HTTP 服务端（可选，通过 "transport-axum" feature 启用）
axum = { workspace = true, optional = true }

# Axum 请求并发上限（可选，通过 "transport-axum" feature 启用）
tower = { workspace = true, optional = true }

# HTTP 横切中间件（可选，通过 "transport-axum" feature 启用）
tower-http = { workspace = true, optional = true }

# 请求作用域上传临时目录（可选，通过 "transport-axum" feature 启用）
tempfile = { workspace = true, optional = true }

# Argon2 密码哈希（可选，通过 "token" feature 启用，用于 action::auth 密码能力）
argon2 = { version = "0.5.3", optional = true }

# 验证码等一次性码的安全随机源（可选，通过 "token" feature 启用）
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

# 验证码摘要 HMAC（可选，通过 "token" feature 启用）
hmac = { version = "0.12.1", optional = true }

# 浏览器会话同源校验的 URI 解析（可选，通过 "token" feature 启用；别名避免与 http feature 重名）
http-uri = { package = "http", version = "1.3.1", optional = true }

# TOTP 第二因子（可选，通过 "token" feature 启用；totp-lite 提供 RFC 6238 算法）
totp-lite = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
testcontainers = "=0.22.0"
env_logger = "0.11.10"
insta = { workspace = true }

# 测试 tracing 输出（Test-1：慢查询 warn 分支断言）
tracing-subscriber = "0.3"
criterion = { version = "=0.6.0", default-features = false, features = ["cargo_bench_support"] }
# trybuild 1.0.106+ 通过 toml 0.9 拉入 Cargo 1.80 无法解析的 Edition 2024 清单。
trybuild = "=1.0.105"

[[bench]]
name = "runtime_baseline"
harness = false

[package.metadata.docs.rs]
all-features = true
