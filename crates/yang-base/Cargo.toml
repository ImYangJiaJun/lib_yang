[package]
name = "yang-base"
version = "0.1.1"
edition.workspace = true

description = "个人使用构建后端服务器"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/yang-base"
readme = "README.md"
keywords = ["backend", "web", "action", "router", "jwt"]
categories = ["web-programming"]

#排除文件
exclude = [
    "INSTALL.md",
]

[lints]
workspace = true

[features]
# 默认启用所有功能，保持向后兼容
default = ["token", "http", "mysql", "redis", "validator", "plugin-schema"]

# JWT Token 管理功能
token = ["dep:jsonwebtoken", "dep:uuid", "redis"]

# HTTP 客户端功能
http = ["dep:reqwest", "dep:serde_urlencoded"]

# MySQL 数据库功能
mysql = ["dep:sqlx", "dep:base64", "sqlx/mysql", "sqlx/derive", "yang-db/mysql"]

# Redis 全局访问与 token 撤销存储
redis = ["yang-db/redis"]

# 字段校验器正则支持
validator = ["dep:regex"]

# 插件 JSON Schema 配置验证
plugin-schema = ["dep:jsonschema"]

# 运行期指标埋点（门面，默认关闭；运行期由调用方挂 exporter）
metrics = ["dep:metrics"]

[dependencies]
# 内部依赖
yang-db = { path = "../yang-db", version = "0.1.3", default-features = false }
yang-base-derive = { path = "../yang-base-derive", version = "0.1.0" }

# 异步运行时
tokio = { workspace = true }
async-trait = "0.1.89"

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
thiserror = { workspace = true }

# 日志
log = { workspace = true }

# 结构化追踪（可观测性 C4 核心横切能力）
tracing = { workspace = true }
tracing-log = { workspace = true }

# 工具库
chrono = { workspace = true }

# Base64 编码（可选，通过 "mysql" feature 启用，用于 DynamicRow 中 BLOB 类型的编码）
base64 = { workspace = true, optional = true }

# HTTP 客户端（可选，通过 "http" feature 启用）
reqwest = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }

# JWT Token（可选，通过 "token" feature 启用）
jsonwebtoken = { workspace = true, optional = true }

# 唯一标识（可选，通过 "token" feature 启用）
uuid = { workspace = true, optional = true }

# 数据库（可选，通过 "mysql" feature 启用）
sqlx = { workspace = true, optional = true }

# 正则表达式（可选，通过 "validator" feature 启用）
regex = { workspace = true, optional = true }

# JSON Schema 验证（可选，通过 "plugin-schema" feature 启用）
jsonschema = { workspace = true, default-features = false, optional = true }

# 指标门面（可选，通过 "metrics" feature 启用）
metrics = { workspace = true, optional = true }

# JSON Schema 派生
schemars = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
testcontainers = "=0.22.0"
env_logger = "0.11.10"
trybuild = { workspace = true }
insta = { workspace = true }

# 测试 tracing 输出（Test-1：慢查询 warn 分支断言）
tracing-subscriber = "0.3"

[package.metadata.docs.rs]
all-features = true
