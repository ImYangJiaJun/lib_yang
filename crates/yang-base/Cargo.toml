[package]
name = "yang-base"
version = "0.0.1"
edition = "2021"

description = "个人使用构建后端服务器"
license = "MIT OR Apache-2.0"

#排除文件
exclude = [
    "INSTALL.md",
]

[dependencies]
# 内部依赖
yang-db = { path = "../yang-db" }

# 异步运行时
tokio = { version = "1.51.0", features = ["full"] }
async-trait = "0.1"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 错误处理
thiserror = "2.0"

# 日志
log = "0.4"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json"] }

# JWT Token
jsonwebtoken = "9.0"

# 工具库
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
regex = "1.0"

# 数据库
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql"] }


[dev-dependencies]
tokio = { version = "1.51.0", features = ["full", "test-util"] }
proptest = "1.5"
mockito = "1.0"
testcontainers = "0.15"
env_logger = "0.11"

