[package]
name = "yang-db"
version = "0.1.3"
edition = "2021"

description = "个人使用数据库操作"
license = "MIT OR Apache-2.0"

#排除文件
exclude = [
    "INSTALL.md",
]

# yang-db 内部使用了 unsafe 代码（用于 MySqlPool 的裸指针操作），
# 需要在 crate 级别允许 unsafe 代码，不使用 workspace lints
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
# yang-db 现有代码中包含大量 unwrap/expect，允许
unwrap_used = "allow"
expect_used = "allow"
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"

[dependencies]
# Redis 连接池
deadpool-redis = "0.23.0"
# Redis 客户端
redis = "1.2.0"
# MySQL 异步驱动
sqlx = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# 时间处理
chrono = { workspace = true }
# 日志
log = { workspace = true }
# Base64 编解码
base64 = "0.22.1"

[dev-dependencies]
proptest = "1.11.0"
testcontainers = "0.27.3"
