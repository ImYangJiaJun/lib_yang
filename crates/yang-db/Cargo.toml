[package]
name = "yang-db"
version = "0.1.3"
edition.workspace = true

description = "个人使用数据库操作"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/yang-db"
readme = "README.md"
keywords = ["mysql", "redis", "database", "sqlx", "query-builder"]
categories = ["database"]

#排除文件
exclude = [
    "INSTALL.md",
]

# yang-db lint 配置：
# - unsafe_code 已升级为 deny，测试中的 MaybeUninit unsafe 已全部替换为 connect_lazy
# - unwrap_used/expect_used 升级为 warn；测试代码中的 unwrap 暂不清理（M-1 范围）
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
# 已知测试代码中仍有 unwrap/expect；生产路径新增的 expect 均有不变量注释
unwrap_used = "warn"
expect_used = "warn"
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"

[dependencies]
# Redis 连接池
deadpool-redis = "=0.22.0"
# Redis 客户端
redis = "0.32"
# MySQL 异步驱动
sqlx = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# 时间处理
chrono = { workspace = true }
# 日志
log = { workspace = true }
# Base64 编解码
base64 = { workspace = true }

[dev-dependencies]
proptest = "1.11.0"
testcontainers = "=0.22.0"
