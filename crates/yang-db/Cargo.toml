[package]
name = "yang-db"
version = "0.1.2"
edition = "2024"

description = "个人使用数据库操作"
license = "MIT OR Apache-2.0"

#排除文件
exclude = [
    "INSTALL.md",
]

[dependencies]
deadpool-redis = "0.23.0"
redis = "1.2.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql", "chrono", "json"] }
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.18"
chrono = "0.4.44"
log = "0.4.29"
base64 = "0.22.1"

[dev-dependencies]
proptest = "1.11.0"
testcontainers = "0.27.3"
