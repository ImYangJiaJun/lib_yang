[package]
name = "yang-db"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true

description = "个人使用数据库操作"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/yang-db"
readme = "README.md"
keywords = ["mysql", "redis", "database", "sqlx", "query-builder"]
categories = ["database"]

[features]
default = ["mysql", "postgres", "redis"]
mysql = ["dep:sqlx", "sqlx/mysql", "sqlx/derive"]
postgres = [
    "dep:sqlx",
    "sqlx/postgres",
    "sqlx/derive",
    # 类型支持只挂在 postgres feature 上：MySQL-only 构建不启用 uuid/bigdecimal。
    "sqlx/uuid",
    "sqlx/bigdecimal",
    "dep:uuid",
    "dep:bigdecimal",
]
redis = ["dep:deadpool-redis", "dep:redis", "dep:futures-util", "dep:uuid"]
# TLS：rediss:// 需要该 feature（rustls + 系统根证书）
redis-tls = ["redis", "deadpool-redis/tokio-rustls-comp"]
# Redis Cluster 拓扑（槽位路由、MOVED/ASK）
redis-cluster = ["redis", "deadpool-redis/cluster"]
# Redis Sentinel 拓扑（master 发现与故障转移）
redis-sentinel = ["redis", "deadpool-redis/sentinel"]
# Redis 客户端指标埋点（可选）
metrics = ["dep:metrics"]
# 仅测试用：允许 rediss://...#insecure 连接自签名 TLS 服务；生产构建不要启用
redis-tls-insecure-test = ["redis", "deadpool-redis/tls-rustls-insecure"]

# yang-db lint 配置：
# - unsafe_code 已升级为 deny，测试中的 MaybeUninit unsafe 已全部替换为 connect_lazy
# - unwrap_used/expect_used 升级为 warn；测试代码中的 unwrap 暂不清理（M-1 范围）
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
# 已知测试代码中仍有 unwrap/expect；生产路径新增的 expect 均有不变量注释
unwrap_used = "warn"
expect_used = "warn"
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"

[dependencies]
# Redis 连接池
deadpool-redis = { version = "=0.22.0", optional = true }
# Redis 客户端（aio/tokio-comp 供 Pub/Sub 专用连接使用）
redis = { workspace = true, optional = true, features = ["aio", "tokio-comp"] }
# Pub/Sub 消息流迭代
futures-util = { workspace = true, optional = true }
# 指标门面（可选，feature "metrics" 启用）
metrics = { workspace = true, optional = true }
# UUID（redis 分布式锁 owner token / postgres 类型支持）
uuid = { workspace = true, optional = true }
# MySQL 异步驱动
sqlx = { workspace = true, optional = true }
# 异步运行时
tokio = { workspace = true }
async-trait = { workspace = true }
# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# 时间处理
chrono = { workspace = true }
# 精确十进制（仅 postgres feature）
bigdecimal = { workspace = true, optional = true }
# 日志
log = { workspace = true }
# 结构化数据库边界；只记录后端、操作与受控表名，不记录 SQL/参数/Redis key。
tracing = { workspace = true }
# Base64 编解码
base64 = { workspace = true }

[dev-dependencies]
proptest.workspace = true
testcontainers = "=0.22.0"
# 集成测试直接构造 PG 类型参数（postgres feature 下同时是常规依赖）
bigdecimal.workspace = true
uuid.workspace = true

[package.metadata.docs.rs]
all-features = true
