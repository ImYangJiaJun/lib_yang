[workspace]
resolver = "2"

members = ["crates/*"]
exclude = ["project/yang-system"]

# 各 crate 共享的包元数据，crate 内通过 `xxx.workspace = true` 引用
[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["YANG <1604024101@qq.com>"]
repository = "https://github.com/ImYangJiaJun/lib_yang"

# 集中声明共享依赖，各 crate 通过 `xxx.workspace = true` 引用
[workspace.dependencies]
# 异步运行时
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1.89"

# 序列化
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
serde_urlencoded = "0.7"
toml = "0.8"

# Base64 编解码
base64 = "0.22"

# Step-up 资源绑定指纹
sha2 = "0.10"

# TOTP 第二因子（RFC 6238；禁止自写 HOTP/TOTP 算法）
totp-lite = "2.0.1"

# 错误处理
anyhow = "1.0"
thiserror = "2.0.18"

# 日志
log = "0.4.29"

# 结构化追踪（可观测性 C4）：tracing 作核心横切能力，
# tracing-log 把现有 log::* 宏桥接进 tracing 订阅者
tracing = "0.1.41"
tracing-log = "0.2.0"

# 指标门面（可选，feature "metrics" 启用；运行期由调用方挂 exporter）
metrics = "0.24.2"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = { version = "0.30", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["grpc-tonic", "tls", "trace"] }
opentelemetry_sdk = { version = "0.30", default-features = false, features = ["trace"] }
tracing-opentelemetry = "0.31"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 时间与唯一标识
chrono = "0.4.44"
uuid = { version = "=1.12.1", features = ["v4"] }

# 正则表达式
regex = "1.12.3"

# 数据库
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "chrono", "json"] }

# HTTP 客户端
#
# TLS 走 rustls + 内置根证书（webpki-roots），**不用** `default-tls`：后者是
# native-tls → Linux 上 openssl-sys，需要系统装 pkg-config 与 libssl-dev 才能构建。
# 生产镜像的构建阶段（`project/yang-system/docker/app/Dockerfile`）不装任何系统包，
# 启用 http feature 后 openssl-sys 会在该阶段硬失败；实测 `rust:1.97.1-slim-bookworm`
# 内既无 pkg-config 也无 /usr/include/openssl。
#
# 这与 sqlx（`runtime-tokio-rustls`）和 lettre（`tokio1-rustls` + `webpki-roots`）
# 的既有取向一致，且 rustls / hyper-rustls / webpki-roots 早已在这些依赖的树里，
# 不新增版本。内置根证书还让运行期不再依赖系统 CA 存储。
#
# **为什么是 `-no-provider` 变体而不是 `rustls-tls-webpki-roots`**：
# 后者会带上 `__rustls-ring`，而那个 feature 里有 `quinn?/ring` 这一条引用。
# 它本身不激活 quinn，却会把 reqwest 的可选依赖 `quinn` 一并锁进 `Cargo.lock`；
# quinn → quinn-proto 硬依赖 `rand 0.10` → `chacha20 0.10` → `cpufeatures 0.3.1`，
# 而 `cpufeatures 0.3.1` 的清单是 edition2024 —— **Cargo 1.80 直接解析失败**，
# 击穿 MSRV job（`cargo check --workspace --all-targets --all-features --locked`）。
# 实测：带 provider 的变体在 MSRV 1.80 下报
# "requires the Cargo feature called `edition2024`"；换 `-no-provider` 后 quinn
# 整条链从 lock 中消失，MSRV 通过。代价是 CryptoProvider 要显式安装，
# 见 `crates/yang-base/src/http/client.rs` 中 `HttpClient::with_config` 的说明。
reqwest = { version = "=0.12.16", default-features = false, features = [
    "rustls-tls-webpki-roots-no-provider",
    "charset",
    "http2",
    "json",
] }

# rustls 的 ring provider。reqwest 的 `-no-provider` 变体不自带 provider，
# 由 `HttpClient::with_config` 在构造客户端时调用 `install_default()` 装上。
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# JWT Token
jsonwebtoken = "=9.3.1"

# JSON Schema 验证
jsonschema = { version = "0.29", default-features = false }

# JSON Schema 派生
schemars = { version = "0.8", features = ["chrono"] }

# 传输路由模板校验（与 Axum 0.8 使用同一匹配器）
matchit = "0.8.4"

# Axum HTTP 服务端（可选；yang-base transport-axum feature 使用）
axum = { version = "0.8.9", features = ["multipart"] }

# HTTP 横切中间件（可选；明确启用无原生构建依赖的压缩算法，保持 MSRV 1.80）
tower-http = { version = "0.7.0", features = ["trace", "cors", "timeout", "compression-br", "compression-deflate", "compression-gzip"] }

# tower Service 工具（测试 oneshot）
tower = { version = "0.5", features = ["util", "limit"] }

# 请求体上限错误识别（可选；yang-base transport-axum feature 使用）。
# 版本必须与 axum 0.8.9 依赖的 http-body-util 统一到 Cargo.lock 已锁定的 0.1.3，
# 否则 downcast 恒为 false，413 会静默退化为 400。
http-body-util = "0.1"

# 请求作用域上传临时目录（仅 transport-axum 启用）；3.24+ 的依赖链不兼容 Cargo 1.80
tempfile = "=3.23.0"

# 派生宏基础设施
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
darling = "0.20"

# 测试基础设施
insta = { version = "=1.42.2", features = ["json"] }
# proptest 1.9+ 的 MSRV 高于工作区 Rust 1.80。
proptest = "=1.8.0"

# Workspace 统一 lint 配置
[workspace.lints.rust]
# 忽略 Result 返回值视为编译错误
unused_must_use = "deny"
# 禁止 unsafe 代码（警告级别，允许测试中使用）
unsafe_code = "warn"

[workspace.lints.clippy]
# 大型枚举变体提示
large_enum_variant = "warn"
