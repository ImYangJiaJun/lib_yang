name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CI_RUST_VERSION: "1.97.1"

jobs:
  supply-chain:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - name: Verify dependency exception boundaries
        run: |
          python scripts/verify_dependency_policy.py --self-test
          python scripts/verify_dependency_policy.py
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources
          arguments: --all-features --locked

  stable:
    name: Stable quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify CI contract
        run: |
          python scripts/verify_ci_contract.py --self-test
          python scripts/verify_ci_contract.py .github/workflows/ci.yml
          python scripts/verify_feature_isolation.py --self-test
          python scripts/run_performance_shadow.py --self-test
          python scripts/run_ci.py --self-test
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: yang-db library tests
        run: cargo test --lib -p yang-db --locked
      - name: yang-base library tests
        run: cargo test --lib -p yang-base --locked
      - name: Auxiliary workspace all-target tests
        run: cargo test --all-targets -p yang-base-derive -p yang-pcg -p yang-runtime --locked
      - name: yang-feishu all-target tests
        run: cargo test --all-targets -p yang-feishu --all-features --locked
      - name: Clippy all targets and features
        run: cargo clippy -p yang-db -p yang-base -p yang-base-derive -p yang-pcg -p yang-runtime -p yang-feishu --all-targets --all-features --locked -- -D warnings
      - name: yang-db documentation tests
        run: cargo test --doc -p yang-db --locked
      - name: yang-base documentation tests
        run: cargo test --doc -p yang-base --locked
      - name: yang-runtime documentation tests
        run: cargo test --doc -p yang-runtime --locked
      - name: yang-feishu documentation tests
        run: cargo test --doc -p yang-feishu --locked

  msrv:
    name: MSRV 1.80
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.80
      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  performance-shadow:
    name: Performance shadow (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Verify performance collector contract
        run: python scripts/run_performance_shadow.py --self-test
      - name: Collect repeated runtime measurements
        # 输出放在 runner.temp：rust-cache 会跨运行恢复并裁剪 target/，
        # 残留的 performance-shadow 空目录会触发采集器"拒绝覆盖历史数据"保护。
        run: python scripts/run_performance_shadow.py --output "${{ runner.temp }}/performance-shadow"
      - name: Upload raw performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-shadow-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-shadow
          if-no-files-found: error
          retention-days: 30

  feature-matrix:
    name: Feature matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: yang-db-none
            package: yang-db
            args: --no-default-features
          - name: yang-db-mysql
            package: yang-db
            args: --no-default-features --features mysql
          - name: yang-db-postgres
            package: yang-db
            args: --no-default-features --features postgres
          - name: yang-db-redis
            package: yang-db
            args: --no-default-features --features redis
          - name: yang-db-all
            package: yang-db
            args: --all-features
          - name: yang-base-none
            package: yang-base
            args: --no-default-features
          - name: yang-base-token
            package: yang-base
            args: --no-default-features --features token
          - name: yang-base-http
            package: yang-base
            args: --no-default-features --features http
          - name: yang-base-mysql
            package: yang-base
            args: --no-default-features --features mysql
          - name: yang-base-postgres
            package: yang-base
            args: --no-default-features --features postgres
          - name: yang-base-mysql-postgres
            package: yang-base
            args: --no-default-features --features mysql,postgres
          - name: yang-base-redis
            package: yang-base
            args: --no-default-features --features redis
          - name: yang-base-validator
            package: yang-base
            args: --no-default-features --features validator
          - name: yang-base-plugin-schema
            package: yang-base
            args: --no-default-features --features plugin-schema
          - name: yang-base-metrics
            package: yang-base
            args: --no-default-features --features metrics
          - name: yang-base-openapi
            package: yang-base
            args: --no-default-features --features openapi
          - name: yang-base-admin-metadata
            package: yang-base
            args: --no-default-features --features admin-metadata
          - name: yang-base-default
            package: yang-base
            args: ""
          - name: yang-base-all
            package: yang-base
            args: --all-features
          - name: yang-feishu-none
            package: yang-feishu
            args: --no-default-features
          - name: yang-feishu-default
            package: yang-feishu
            args: ""
          - name: yang-feishu-bitable
            package: yang-feishu
            args: --no-default-features --features bitable
          - name: yang-feishu-docs
            package: yang-feishu
            args: --no-default-features --features docs
          - name: yang-feishu-api-all
            package: yang-feishu
            args: --no-default-features --features api-all
          - name: yang-feishu-http
            package: yang-feishu
            args: --no-default-features --features http
          - name: yang-feishu-redis
            package: yang-feishu
            args: --no-default-features --features redis
          - name: yang-feishu-metrics
            package: yang-feishu
            args: --no-default-features --features metrics
          - name: yang-feishu-all
            package: yang-feishu
            args: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Check feature combination
        run: cargo check -p ${{ matrix.package }} ${{ matrix.args }} --locked
      - name: Test feature combination
        run: cargo test --lib -p ${{ matrix.package }} ${{ matrix.args }} --locked
      - name: Test documentation feature combination
        run: cargo test --doc -p ${{ matrix.package }} ${{ matrix.args }} --locked

  docker-mysql:
    name: MySQL 8.0 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Pin service images
        run: |
          docker pull mysql:8.0
          docker pull redis:7-alpine
      - name: Typed Action integration
        run: cargo test -p yang-base --test typed_action_integration --locked -- --ignored --test-threads=1
      - name: TableQuery CRUD integration
        run: cargo test -p yang-base --test table_query_crud_test --locked -- --ignored --test-threads=1
      - name: TableQuery pagination integration
        run: cargo test -p yang-base --test table_query_paginate_test --locked -- --ignored --test-threads=1
      - name: TableQuery transaction integration
        run: cargo test -p yang-base --test table_query_transaction_test --locked -- --ignored --test-threads=1

  docker-postgres:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: PostgreSQL CRUD integration
        run: cargo test -p yang-db --test integration_pg_crud_simple --locked -- --ignored --test-threads=1
      - name: PostgreSQL transaction integration
        run: cargo test -p yang-db --test integration_pg_transaction --locked -- --ignored --test-threads=1
      - name: yang-base PostgreSQL Record decoding integration
        run: cargo test -p yang-base --no-default-features --features postgres --test integration_record_pg --locked -- --ignored --test-threads=1
      - name: yang-base PostgreSQL schema sync integration
        run: cargo test -p yang-base --no-default-features --features postgres --test integration_schema_sync_pg --locked -- --ignored --test-threads=1
      - name: yang-base PostgreSQL TableQuery integration
        run: cargo test -p yang-base --no-default-features --features postgres --test integration_table_query_pg --locked -- --ignored --test-threads=1
      - name: yang-base PostgreSQL Phase C integration
        run: cargo test -p yang-base --no-default-features --features postgres --test integration_table_query_pg_phase_c --locked -- --ignored --test-threads=1

  docker-postgres-17:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-latest
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - name: Start PostgreSQL 17 with 2PC enabled
        run: |
          docker run -d --name pg17 -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=test \
            postgres:17-alpine -c max_prepared_transactions=16
          for _ in $(seq 1 30); do
            if docker exec pg17 pg_isready -U postgres -d test; then
              exit 0
            fi
            sleep 2
          done
          docker logs pg17
          exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: PostgreSQL Phase A integration
        run: cargo test -p yang-db --test integration_pg_phase_a --locked -- --ignored --test-threads=1
      - name: PostgreSQL Phase B queries integration
        run: cargo test -p yang-db --test integration_pg_phase_b_queries --locked -- --ignored --test-threads=1
      - name: PostgreSQL Phase B runtime integration
        run: cargo test -p yang-db --test integration_pg_phase_b_runtime --locked -- --ignored --test-threads=1
      - name: PostgreSQL Phase B types integration
        run: cargo test -p yang-db --test integration_pg_phase_b_types --locked -- --ignored --test-threads=1
      - name: PostgreSQL Phase B COPY/LISTEN integration
        run: cargo test -p yang-db --test integration_pg_phase_b_copy_listen --locked -- --ignored --test-threads=1
      - name: PostgreSQL Phase C integration
        run: cargo test -p yang-db --no-default-features --features postgres --test integration_pg_phase_c --locked -- --ignored --test-threads=1
      - name: PostgreSQL type property tests
        run: cargo test -p yang-db --no-default-features --features postgres --test proptest_pg_types --locked -- --ignored --test-threads=1
      - name: yang-base PostgreSQL Record decoding integration
        run: cargo test -p yang-base --no-default-features --features postgres --test integration_record_pg --locked -- --ignored --test-threads=1
      - name: yang-base PostgreSQL schema sync integration
        run: cargo test -p yang-base --no-default-features --features postgres --test integration_schema_sync_pg --locked -- --ignored --test-threads=1
      - name: yang-base PostgreSQL TableQuery integration
        run: cargo test -p yang-base --no-default-features --features postgres --test integration_table_query_pg --locked -- --ignored --test-threads=1
      - name: yang-base PostgreSQL Phase C integration
        run: cargo test -p yang-base --no-default-features --features postgres --test integration_table_query_pg_phase_c --locked -- --ignored --test-threads=1

  docker-redis:
    name: Redis 7 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Pin Redis image
        run: docker pull redis:7-alpine
      - name: Redis pipeline integration
        run: cargo test -p yang-db --test integration_redis_pipeline --locked -- --test-threads=1
      - name: Token revocation integration
        run: cargo test -p yang-base --test token_revocation_integration --locked -- --ignored --test-threads=1
      - name: Email verification integration
        run: cargo test -p yang-base --test email_verification_integration --locked -- --ignored --test-threads=1
      - name: Redis script integration
        run: cargo test -p yang-db --test integration_redis_script --locked -- --test-threads=1
