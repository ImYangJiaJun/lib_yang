name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CI_RUST_VERSION: "1.97.1"

jobs:
  supply-chain:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - name: Verify dependency exception boundaries
        run: |
          python scripts/verify_dependency_policy.py --self-test
          python scripts/verify_dependency_policy.py
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources
          arguments: --all-features --locked

  stable:
    name: Stable quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify CI contract
        run: |
          python scripts/verify_ci_contract.py --self-test
          python scripts/verify_ci_contract.py .github/workflows/ci.yml
          python scripts/verify_feature_isolation.py --self-test
          python scripts/run_ci.py --self-test
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: yang-db library tests
        run: cargo test --lib -p yang-db --locked
      - name: yang-base library tests
        run: cargo test --lib -p yang-base --locked
      - name: Auxiliary workspace all-target tests
        run: cargo test --all-targets -p yang-base-derive -p yang-migrate -p yang-pcg --locked
      - name: Clippy all targets and features
        run: cargo clippy -p yang-db -p yang-base -p yang-base-derive -p yang-migrate -p yang-pcg --all-targets --all-features --locked -- -D warnings
      - name: yang-db documentation tests
        run: cargo test --doc -p yang-db --locked
      - name: yang-base documentation tests
        run: cargo test --doc -p yang-base --locked

  msrv:
    name: MSRV 1.80
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.80
      - name: Check public crates on MSRV
        run: cargo check -p yang-db -p yang-base --all-features --locked

  feature-matrix:
    name: Feature matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: yang-db-none
            package: yang-db
            args: --no-default-features
          - name: yang-db-mysql
            package: yang-db
            args: --no-default-features --features mysql
          - name: yang-db-postgres
            package: yang-db
            args: --no-default-features --features postgres
          - name: yang-db-redis
            package: yang-db
            args: --no-default-features --features redis
          - name: yang-db-all
            package: yang-db
            args: --all-features
          - name: yang-base-none
            package: yang-base
            args: --no-default-features
          - name: yang-base-token
            package: yang-base
            args: --no-default-features --features token
          - name: yang-base-http
            package: yang-base
            args: --no-default-features --features http
          - name: yang-base-mysql
            package: yang-base
            args: --no-default-features --features mysql
          - name: yang-base-redis
            package: yang-base
            args: --no-default-features --features redis
          - name: yang-base-validator
            package: yang-base
            args: --no-default-features --features validator
          - name: yang-base-plugin-schema
            package: yang-base
            args: --no-default-features --features plugin-schema
          - name: yang-base-metrics
            package: yang-base
            args: --no-default-features --features metrics
          - name: yang-base-openapi
            package: yang-base
            args: --no-default-features --features openapi
          - name: yang-base-admin-metadata
            package: yang-base
            args: --no-default-features --features admin-metadata
          - name: yang-base-default
            package: yang-base
            args: ""
          - name: yang-base-all
            package: yang-base
            args: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Check feature combination
        run: cargo check -p ${{ matrix.package }} ${{ matrix.args }} --locked
      - name: Test feature combination
        run: cargo test --lib -p ${{ matrix.package }} ${{ matrix.args }} --locked
      - name: Test documentation feature combination
        run: cargo test --doc -p ${{ matrix.package }} ${{ matrix.args }} --locked

  docker-mysql:
    name: MySQL 8.0 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Pin service images
        run: |
          docker pull mysql:8.0
          docker pull redis:7-alpine
      - name: Typed Action integration
        run: cargo test -p yang-base --test typed_action_integration --locked -- --ignored --test-threads=1
      - name: TableQuery CRUD integration
        run: cargo test -p yang-base --test table_query_crud_test --locked -- --ignored --test-threads=1
      - name: TableQuery pagination integration
        run: cargo test -p yang-base --test table_query_paginate_test --locked -- --ignored --test-threads=1
      - name: TableQuery transaction integration
        run: cargo test -p yang-base --test table_query_transaction_test --locked -- --ignored --test-threads=1

  docker-postgres:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: PostgreSQL CRUD integration
        run: cargo test -p yang-db --test integration_pg_crud_simple --locked -- --ignored --test-threads=1
      - name: PostgreSQL transaction integration
        run: cargo test -p yang-db --test integration_pg_transaction --locked -- --ignored --test-threads=1

  docker-redis:
    name: Redis 7 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Pin Redis image
        run: docker pull redis:7-alpine
      - name: Redis pipeline integration
        run: cargo test -p yang-db --test integration_redis_pipeline --locked -- --test-threads=1
      - name: Redis script integration
        run: cargo test -p yang-db --test integration_redis_script --locked -- --test-threads=1
